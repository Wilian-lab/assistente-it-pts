spring.datasource.url=jdbc:postgresql://localhost:5432/assistant_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
spring.config.import=optional:classpath:application-local.properties,optional:file:./config/application-local.properties,optional:file:./.env.properties


security.token.secret=Bck-End#
security.token.issuer=backend-assistent
security.token.expires-in-seconds=${SECURITY_TOKEN_EXPIRES_IN_SECONDS:28800}
app.admin.name=Administrador Sistema
app.admin.email=admin@teste.com
app.admin.password=admin12345
app.admin.setores=AGRI_PRODUCTS,MOAGEM

app.storage.base-dir=${APP_STORAGE_BASE_DIR:../assistente_chatbot/pts_chatbot}
app.storage.pts-excel-path=${APP_STORAGE_PTS_EXCEL_PATH:${app.storage.base-dir}/data/PTS_Agriproducts_02.xlsx}
app.storage.it-dir=${APP_STORAGE_IT_DIR:${app.storage.base-dir}/docs/ITs}

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

assistant.it-index.path=${ASSISTANT_IT_INDEX_PATH:../Fron-React/public/data/it_index.json}
assistant.gemini.url=${ASSISTANT_GEMINI_URL:https://generativelanguage.googleapis.com/v1beta}
assistant.gemini.model=${ASSISTANT_GEMINI_MODEL:gemini-2.5-flash-lite}
assistant.gemini.api-key=${ASSISTANT_GEMINI_API_KEY:${GEMINI_API_KEY:${GOOGLE_API_KEY:}}}
assistant.openrouter.url=${ASSISTANT_OPENROUTER_URL:https://openrouter.ai/api/v1/chat/completions}
assistant.openrouter.model=${ASSISTANT_OPENROUTER_MODEL:nvidia/nemotron-3-super:free}
assistant.openrouter.fallback-model=${ASSISTANT_OPENROUTER_FALLBACK_MODEL:openai/gpt-oss-120b:free}
assistant.openrouter.extra-fallback-models=${ASSISTANT_OPENROUTER_EXTRA_FALLBACK_MODELS:meta-llama/llama-3.3-70b-instruct:free,openai/gpt-oss-20b:free,mistralai/mistral-small-3.1-24b-instruct:free,openrouter/free}
assistant.openrouter.api-key=${ASSISTANT_OPENROUTER_API_KEY:}
assistant.openrouter.app-name=${ASSISTANT_OPENROUTER_APP_NAME:Assistente IT}
