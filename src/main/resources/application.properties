spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assistant_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.port=8080
spring.config.import=optional:classpath:application-local.properties,optional:file:./config/application-local.properties,optional:file:./.env.properties


security.token.secret=${SECURITY_TOKEN_SECRET:}
security.token.issuer=backend-assistent
security.token.expires-in-seconds=${SECURITY_TOKEN_EXPIRES_IN_SECONDS:28800}
app.admin.name=${APP_ADMIN_NAME:Administrador Sistema}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.setores=${APP_ADMIN_SETORES:GLOBAL}
app.admin.recovery-code=${APP_ADMIN_RECOVERY_CODE:}
app.setor-linked-groups=${APP_SETOR_LINKED_GROUPS:}
app.security.allowed-origin-patterns=${APP_SECURITY_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

app.password-reset.token-ttl-minutes=${APP_PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
app.password-reset.frontend-url=${APP_PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/reset-password}
app.password-reset.mail-from=${APP_PASSWORD_RESET_MAIL_FROM:${SPRING_MAIL_USERNAME:no-reply@assistente.local}}
app.password-reset.mail-subject=${APP_PASSWORD_RESET_MAIL_SUBJECT:Recuperacao de senha - Assistente IT}

spring.mail.host=${SPRING_MAIL_HOST:smtp.office365.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

app.storage.base-dir=${APP_STORAGE_BASE_DIR:../assistente_chatbot/pts_chatbot}
app.storage.pts-excel-path=${APP_STORAGE_PTS_EXCEL_PATH:${app.storage.base-dir}/data/PTS_Agriproducts_02.xlsx}
app.storage.it-dir=${APP_STORAGE_IT_DIR:${app.storage.base-dir}/docs/ITs}

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

assistant.it-index.path=${ASSISTANT_IT_INDEX_PATH:frontend/public/data/it_index.json}
assistant.gemini.url=${ASSISTANT_GEMINI_URL:https://generativelanguage.googleapis.com/v1beta}
assistant.gemini.model=${ASSISTANT_GEMINI_MODEL:gemini-2.5-flash-lite}
assistant.gemini.api-key=${ASSISTANT_GEMINI_API_KEY:${GEMINI_API_KEY:${GOOGLE_API_KEY:}}}
